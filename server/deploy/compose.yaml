services:
  pocketlarder:
    build: ..
    container_name: pocketlarder
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POCKETLARDER_PUBLIC_URL: ${POCKETLARDER_PUBLIC_URL:?set it in server/deploy/.env}
    volumes:
      - ${POCKETLARDER_HOST_DATA_DIR:?set it in server/deploy/.env}:/data
    ports: ["127.0.0.1:8080:8080"]
